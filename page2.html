<title>My Wishlist — Superlight 2</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    background: #000;
    color: #fff;
    font-family: Arial, sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
}

/* =========================
   КНОПКА НАЗАД
========================= */

.back-button {
    position: fixed;
    top: 30px;
    left: 35px;
    z-index: 100;
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 13px 22px;
    color: #fff;
    text-decoration: none;
    font-size: 14px;
    letter-spacing: 2px;
    border: 1px solid rgba(255,255,255,.25);
    border-radius: 30px;
    background: rgba(255,255,255,.04);
    transition:
        color .3s ease,
        border-color .3s ease,
        background .3s ease,
        transform .2s ease,
        box-shadow .3s ease;
    animation: backAppear .7s ease forwards;
}

.back-button:hover {
    color: #ff2b2b;
    border-color: rgba(255,40,40,.7);
    background: rgba(255,0,0,.06);
    box-shadow:
        0 0 15px rgba(255,0,0,.15),
        inset 0 0 12px rgba(255,0,0,.05);
}

.back-button:active {
    transform: translateX(-5px) scale(.94);
    color: #ff0000;
    border-color: #ff0000;
    box-shadow:
        0 0 25px rgba(255,0,0,.45),
        inset 0 0 15px rgba(255,0,0,.12);
}

@keyframes backAppear {
    from {
        opacity: 0;
        transform: translateX(-30px);
    }
    to {
        opacity: 1;
        transform: translateX(0);
    }
}

/* =========================
   СТРАНИЦА
========================= */

.product-page {
    min-height: 100vh;
    padding: 90px 50px 60px;
}

.product-container {
    width: 100%;
    max-width: 1250px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: 1.15fr .85fr;
    gap: 65px;
    align-items: center;
}

/* =========================
   ГАЛЕРЕЯ
========================= */

.gallery {
    height: 600px;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    animation: galleryAppear .8s ease forwards;
}

@keyframes galleryAppear {
    from {
        opacity: 0;
        transform: translateX(-35px);
    }
    to {
        opacity: 1;
        transform: translateX(0);
    }
}

.image-container {
    width: 560px;
    height: 560px;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
}

.product-image {
    width: 100%;
    height: 100%;
    object-fit: contain;
    opacity: 1;
    transform: scale(1);
    transition:
        opacity .25s ease,
        transform .25s ease;
}

.product-image.changing {
    opacity: .38;
    transform: scale(.92);
}

/* =========================
   СТРЕЛКИ
========================= */

.gallery-arrow {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    width: 52px;
    height: 52px;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,.25);
    background: rgba(255,255,255,.04);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 25px;
    cursor: pointer;
    z-index: 10;
    transition:
        color .25s ease,
        border-color .25s ease,
        background .25s ease,
        box-shadow .25s ease,
        transform .2s ease;
    animation: arrowsAppear .7s ease .35s both;
}

.gallery-arrow.left {
    left: 5px;
}

.gallery-arrow.right {
    right: 5px;
}

.gallery-arrow:hover {
    color: #ff2020;
    border-color: rgba(255,0,0,.7);
    background: rgba(255,0,0,.06);
    box-shadow: 0 0 18px rgba(255,0,0,.25);
}

.gallery-arrow.left:hover {
    transform: translateY(-50%) translateX(-3px);
}

.gallery-arrow.right:hover {
    transform: translateY(-50%) translateX(3px);
}

.gallery-arrow:active {
    color: #ff0000;
    border-color: #ff0000;
    background: rgba(255,0,0,.12);
    box-shadow:
        0 0 30px rgba(255,0,0,.55),
        inset 0 0 12px rgba(255,0,0,.12);
    transform: translateY(-50%) scale(.82);
}

.gallery-arrow.left:active {
    transform: translateY(-50%) translateX(-6px) scale(.82);
}

.gallery-arrow.right:active {
    transform: translateY(-50%) translateX(6px) scale(.82);
}

@keyframes arrowsAppear {
    from {
        opacity: 0;
        transform: translateY(-50%) scale(.7);
    }
    to {
        opacity: 1;
        transform: translateY(-50%) scale(1);
    }
}

/* =========================
   ПРАВАЯ ЧАСТЬ
========================= */

.product-info {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
}

.brand {
    font-size: 13px;
    letter-spacing: 5px;
    color: #888;
    margin-bottom: 15px;
    animation: infoItemAppear .65s ease .18s both;
}

.product-title {
    font-size: clamp(34px, 4vw, 58px);
    line-height: 1.05;
    font-weight: 700;
    margin-bottom: 25px;
    animation: infoItemAppear .65s ease .28s both;
    transition:
        opacity .22s ease,
        transform .22s ease;
}

.product-title.title-changing {
    opacity: 0;
    transform: translateY(8px);
}

.product-description {
    max-width: 500px;
    color: #999;
    font-size: 15px;
    line-height: 1.7;
    margin-bottom: 35px;
    animation: infoItemAppear .65s ease .39s both;
}

.color-title {
    font-size: 13px;
    letter-spacing: 3px;
    color: #888;
    margin-bottom: 15px;
    animation: infoItemAppear .65s ease .50s both;
}

.color-options {
    display: flex;
    gap: 14px;
    margin-bottom: 35px;
    animation: infoItemAppear .65s ease .58s both;
}

/* =========================
   ЦВЕТА
========================= */

.color-button {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    border: 2px solid transparent;
    cursor: pointer;
    position: relative;
    transition:
        transform .25s ease,
        border-color .25s ease,
        box-shadow .25s ease;
}

.color-button::after {
    content: "";
    position: absolute;
    inset: -6px;
    border-radius: 50%;
    border: 1px solid transparent;
    transition:
        border-color .25s ease,
        box-shadow .25s ease;
}

.color-button:hover {
    transform: scale(1.16);
}

.color-button.active {
    transform: scale(1.15);
    border-color: #fff;
}

.color-button.active::after {
    border-color: rgba(255,255,255,.35);
    box-shadow: 0 0 12px rgba(255,255,255,.18);
}

.color-red {
    background: #e00000;
}

.color-blue {
    background: #19a9ff;
}

.color-pink {
    background: #ff75b9;
}

.color-black {
    background: #151515;
    border-color: #444;
}

.color-white {
    background: #fff;
}

/* =========================
   ЦЕНА
========================= */

.product-price {
    font-size: 32px;
    font-weight: 700;
    margin-bottom: 30px;
    animation: infoItemAppear .65s ease .68s both;
    transition:
        opacity .22s ease,
        transform .22s ease;
}

.product-price.price-changing {
    opacity: .72;
    transform: translateY(0);
    transition: opacity .16s ease;
}

/* =========================
   КНОПКИ
========================= */

.product-buttons {
    display: flex;
    gap: 14px;
    animation: infoItemAppear .65s ease .80s both;
}

.reserve-button,
.website-button {
    padding: 15px 25px;
    border-radius: 30px;
    font-size: 13px;
    letter-spacing: 1.5px;
    cursor: pointer;
    transition:
        transform .25s ease,
        color .25s ease,
        background .25s ease,
        border-color .25s ease,
        box-shadow .25s ease;
}

.reserve-button {
    border: 1px solid #fff;
    background: #fff;
    color: #000;
}

.reserve-button:hover:not(:disabled) {
    background: #ff2020;
    border-color: #ff2020;
    color: #fff;
    box-shadow: 0 0 25px rgba(255,0,0,.35);
    transform: translateY(-2px);
}

.reserve-button:active:not(:disabled) {
    transform: scale(.91);
    background: #d60000;
    border-color: #d60000;
    color: #fff;
    box-shadow:
        0 0 35px rgba(255,0,0,.65),
        0 0 60px rgba(255,0,0,.25),
        inset 0 0 15px rgba(255,255,255,.15);
}

.reserve-button:disabled {
    cursor: not-allowed;
    opacity: .65;
}

.reserve-button.reserved-by-other {
    background: #222;
    color: #aaa;
    border-color: #444;
}

.website-button {
    border: 1px solid rgba(255,255,255,.25);
    background: transparent;
    color: #fff;
}

.website-button:hover {
    border-color: rgba(255,0,0,.7);
    color: #ff2020;
    box-shadow: 0 0 18px rgba(255,0,0,.15);
    transform: translateY(-2px);
}

.website-button:active {
    transform: scale(.94);
    color: #ff0000;
    border-color: #ff0000;
    box-shadow: 0 0 28px rgba(255,0,0,.45);
}

/* =========================
   СООБЩЕНИЕ БРОНИРОВАНИЯ
========================= */

.reserve-message {
    margin-top: 18px;
    color: #ff3030;
    font-size: 13px;
    letter-spacing: 1px;
    line-height: 1.5;
    opacity: 0;
    transform: translateY(8px);
    pointer-events: none;
}

.reserve-message.show {
    animation: reserveMessage .55s ease forwards;
}

.reserve-message.success {
    color: #70e69a;
}

.reserve-message.error {
    color: #ff3030;
}

@keyframes reserveMessage {
    0% {
        opacity: 0;
        transform: translateY(8px);
    }
    40% {
        opacity: 1;
        transform: translateY(0);
    }
    100% {
        opacity: 1;
        transform: translateY(0);
    }
}

/* =========================
   ОБЩАЯ АНИМАЦИЯ
========================= */

@keyframes infoItemAppear {
    from {
        opacity: 0;
        transform: translateY(22px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

/* =========================
   АДАПТИВ
========================= */

@media (max-width: 900px) {
    .product-container {
        grid-template-columns: 1fr;
        gap: 30px;
    }

    .gallery {
        height: 500px;
    }

    .image-container {

    }

    .product-info {
        align-items: center;

    }

    .product-description {
        max-width: 600px;
    }

    .color-options {
        justify-content: center;
    }

    .product-buttons {
        justify-content: center;
        flex-wrap: wrap;
    }
}

@media (max-width: 600px) {
    .product-page {
        padding: 100px 20px 45px;
    }

    .back-button {
        top: 20px;
        left: 20px;
        padding: 10px 17px;
        font-size: 11px;
    }

    .gallery {
        height: 390px;
    }

    .image-container {
        width: 340px;
        height: 340px;
    }

    .gallery-arrow {
        width: 44px;
        height: 44px;
        font-size: 21px;
    }

    .gallery-arrow.left {
        left: 0;
    }

    .gallery-arrow.right {
        right: 0;
    }

    .product-title {
        font-size: 35px;
    }

    .product-description {
        font-size: 14px;
    }

    .product-price {
        font-size: 28px;
    }

    .product-buttons {
        width: 100%;
        flex-direction: column;
        align-items: center;
    }

    .reserve-button,
    .website-button {
        width: min(100%, 300px);
    }
}
</style>

<script>

================================================== */

const navigationEntry = performance.getEntriesByType("navigation")[0];

if (navigationEntry && navigationEntry.type === "reload") {

/* ==================================================

================================================== */

const SUPABASE_URL = "https://ucsbjfouyteyxaojrudb.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_LuQk6LrHSJB5HXbzSJvQyw_Loj5L9QM";

let supabaseClient = null;
let currentUserId = null;
let supabaseReady = false;
let reservationRequestInProgress = false;
let reservationPollTimer = null;

/* ==================================================
   ДАННЫЕ ТОВАРОВ
================================================== */

const colors = {
    red: {

        ]
    },

    pink: {

        price: "4 899 ₴",
        website: "https://www.foxtrot.com.ua/uk/shop/kompyuterniye_miyshi_logitech_g_pro_x_superlight_2_lightspeed_gaming_magenta.html",
        images: [
            "images/superlight-pink.webp",
            "images/superlight-pink-2.webp",
            "images/superlight-pink-3.webp",
            "images/superlight-pink-4.webp"
        ]
    },

    black: {
        title: "PRO X SUPERLIGHT 2 LIGHTSPEED",
        price: "4 999 ₴",
        website: "https://www.foxtrot.com.ua/uk/shop/kompyuterniye_miyshi_logitech_pro_x_superlight_2_lightspeed_black.html",
        images: [
            "images/superlight-black.webp",
            "images/superlight-black-2.webp",
            "images/superlight-black-3.webp",
            "images/superlight-black-4.webp"
        ]
    },

    white: {
        title: "PRO X SUPERLIGHT 2 LIGHTSPEED",
        price: "4 899 ₴",
        website: "https://allo.ua/ua/myshki-klaviatury/myshka-logitech-g-pro-x-superlight-2-lightspeed-wireless-white-910-006638.html",
        images: [

            "images/superlight-white-2.webp",
            "images/superlight-white-3.webp",
            "images/superlight-white-4.webp"
        ]
    }
};

/* ==================================================
   ЭЛЕМЕНТЫ СТРАНИЦЫ
================================================== */

const productImage = document.getElementById("productImage");
const productTitle = document.getElementById("productTitle");
const productPrice = document.getElementById("productPrice");
const websiteButton = document.getElementById("websiteButton");
const reserveButton = document.getElementById("reserveButton");
const reserveMessage = document.getElementById("reserveMessage");
const colorButtons = document.querySelectorAll(".color-button");
const prevImage = document.getElementById("prevImage");
const nextImage = document.getElementById("nextImage");
const backButton = document.querySelector(".back-button");

/* ==================================================
   ПЕРЕМЕННЫЕ ГАЛЕРЕИ
================================================== */

let currentColor = "red";
let currentImage = 0;
let colorChanging = false;

/* ==================================================
   ПРЕДЗАГРУЗКА ФОТО
================================================== */

Object.values(colors).forEach(color => {
    color.images.forEach(src => {
        const img = new Image();
        img.src = src;
    });
});

/* ==================================================
   СООБЩЕНИЯ БРОНИРОВАНИЯ
================================================== */

function showReserveMessage(message, type = "error") {
    reserveMessage.textContent = message;
    reserveMessage.className = "reserve-message show " + type;
}

function hideReserveMessage() {
    reserveMessage.className = "reserve-message";
    reserveMessage.textContent = "";
}

/* ==================================================
   ИДЕНТИФИКАТОР ТЕКУЩЕГО ВАРИАНТА
================================================== */

function getCurrentProductId() {
    return `logitech-superlight-2-${currentColor}`;
}

/* ==================================================
   ОБНОВЛЕНИЕ ВИДА КНОПКИ ПО БРОНИ
================================================== */

function setReservationButtonState(reservation) {
    reserveButton.classList.remove("reserved-by-other");
    reserveButton.disabled = false;

    if (!reservation) {
        reserveButton.textContent = "ЗАБРОНИРОВАТЬ";
        reserveButton.dataset.state = "available";
        return;
    }

    if (reservation.user_id === currentUserId) {
        reserveButton.textContent = "ОТМЕНИТЬ БРОНЬ";
        reserveButton.dataset.state = "mine";
        return;
    }

    reserveButton.textContent = "УЖЕ ЗАБРОНИРОВАНО";
    reserveButton.dataset.state = "other";
    reserveButton.disabled = true;
    reserveButton.classList.add("reserved-by-other");
}

/* ==================================================
   ПРОВЕРКА БРОНИРОВАНИЯ В SUPABASE
================================================== */

async function refreshReservationState(showErrors = false) {
    if (!supabaseReady || !supabaseClient || !currentUserId) {
        return;
    }

    const productId = getCurrentProductId();

    const { data, error } = await supabaseClient
        .from("reservations")
        .select("product_id, user_id")
        .eq("product_id", productId)
        .maybeSingle();

    if (error) {
        console.error("Ошибка проверки брони:", error);

        if (showErrors) {
            showReserveMessage(
                `Не удалось проверить бронь: ${error.message}`,
                "error"
            );
        }

        return;
    }

    setReservationButtonState(data);
}

/* ==================================================
   ПОДКЛЮЧЕНИЕ SUPABASE И АНОНИМНЫЙ ВХОД
================================================== */

async function initializeSupabase() {
    try {
        if (!window.supabase || typeof window.supabase.createClient !== "function") {
            throw new Error(
                "Библиотека Supabase не загрузилась. Проверь подключение к интернету и CDN."
            );
        }

        supabaseClient = window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_ANON_KEY
        );

        let { data: sessionData, error: sessionError } =
            await supabaseClient.auth.getSession();

        if (sessionError) {
            throw sessionError;
        }

        if (!sessionData.session) {
            const { data, error } =
                await supabaseClient.auth.signInAnonymously();

            if (error) {
                throw error;
            }

            sessionData = { session: data.session };
        }

        currentUserId = sessionData.session?.user?.id;

        if (!currentUserId) {
            throw new Error("Supabase не вернул ID пользователя.");
        }

        supabaseReady = true;

        await refreshReservationState(true);

        if (reservationPollTimer) {
            clearInterval(reservationPollTimer);
        }

        reservationPollTimer = setInterval(() => {
            refreshReservationState(false);
        }, 5000);

    } catch (error) {
        console.error("Supabase initialization error:", error);
        console.error("Supabase error details:", {
            message: error?.message,
            status: error?.status,
            code: error?.code
        });

        supabaseReady = false;
        reserveButton.disabled = true;
        reserveButton.textContent = "НЕТ СОЕДИНЕНИЯ";

        showReserveMessage(
            `Ошибка подключения: ${error?.message || "неизвестная ошибка"}`,
            "error"
        );
    }
}

/* ==================================================
   БРОНИРОВАНИЕ / ОТМЕНА
================================================== */

reserveButton.addEventListener("click", async () => {
    if (!supabaseReady || !supabaseClient || !currentUserId) {
        showReserveMessage("Подключение к бронированию ещё не готово.", "error");
        return;
    }

    if (reservationRequestInProgress) {
        return;
    }

    reservationRequestInProgress = true;
    reserveButton.disabled = true;

    reserveButton.classList.remove("reserve-click");
    void reserveButton.offsetWidth;
    reserveButton.classList.add("reserve-click");

    const productId = getCurrentProductId();
    const buttonState = reserveButton.dataset.state;

    try {
        if (buttonState === "mine") {
            const { error } = await supabaseClient
                .from("reservations")
                .delete()
                .eq("product_id", productId)
                .eq("user_id", currentUserId);

            if (error) {
                throw error;
            }

            showReserveMessage("Бронирование отменено.", "success");
        } else if (buttonState === "available") {
            const { error } = await supabaseClient
                .from("reservations")
                .insert({
                    product_id: productId,
                    user_id: currentUserId
                });

            if (error) {
                if (error.code === "23505") {
                    showReserveMessage("Этот вариант уже успели забронировать.", "error");
                } else {
                    throw error;
                }
            } else {
                showReserveMessage("Товар успешно забронирован!", "success");
            }
        }

        await refreshReservationState(true);

    } catch (error) {
        console.error("Ошибка бронирования:", error);
        showReserveMessage(
            `Не удалось выполнить действие: ${error?.message || "неизвестная ошибка"}`,
            "error"
        );

        await refreshReservationState(false);
    } finally {
        reservationRequestInProgress = false;

        if (reserveButton.dataset.state !== "other") {
            reserveButton.disabled = false;
        }
    }
});

/* ==================================================
   СМЕНА ФОТО
================================================== */

function changeImage(index) {
    if (colorChanging) return;

    const images = colors[currentColor].images;

    if (!images.length) return;

    currentImage = (index + images.length) % images.length;

    productImage.classList.add("changing");

    setTimeout(() => {
        productImage.src = images[currentImage];

        productImage.onload = () => {
            requestAnimationFrame(() => {
                productImage.classList.remove("changing");
            });
        };

        productImage.onerror = () => {
            productImage.classList.remove("changing");
            console.error("Не удалось загрузить изображение:", productImage.src);
        };

        setTimeout(() => {
            productImage.classList.remove("changing");
        }, 250);
    }, 180);
}

/* ==================================================
   СТРЕЛКИ ГАЛЕРЕИ
================================================== */

prevImage.addEventListener("click", () => {
    prevImage.classList.remove("arrow-click");
    void prevImage.offsetWidth;
    prevImage.classList.add("arrow-click");

    currentImage--;
    changeImage(currentImage);
});

nextImage.addEventListener("click", () => {
    nextImage.classList.remove("arrow-click");
    void nextImage.offsetWidth;
    nextImage.classList.add("arrow-click");

    currentImage++;
    changeImage(currentImage);
});

const arrowClickStyle = document.createElement("style");

arrowClickStyle.textContent = `
.gallery-arrow.arrow-click {
    animation: arrowClickAnimation .32s ease;
}

@keyframes arrowClickAnimation {
    0% {
        transform: translateY(-50%) scale(1);
    }
    35% {
        transform: translateY(-50%) scale(.78);
    }
    70% {
        transform: translateY(-50%) scale(1.08);
    }
    100% {
        transform: translateY(-50%) scale(1);
    }
}
`;

document.head.appendChild(arrowClickStyle);

/* ==================================================
   СМЕНА ЦВЕТА
================================================== */

colorButtons.forEach(button => {
    button.addEventListener("click", async () => {
        const selectedColor = button.dataset.color;

        if (selectedColor === currentColor || colorChanging) {
            return;
        }

        colorChanging = true;

        colorButtons.forEach(item => {
            item.classList.remove("active");
        });

        button.classList.add("active");

        productTitle.classList.add("title-changing");
        productPrice.classList.add("price-changing");
        productImage.classList.add("changing");

        setTimeout(() => {
            currentColor = selectedColor;
            currentImage = 0;

            const data = colors[currentColor];

            productTitle.textContent = data.title;
            productPrice.textContent = data.price;
            productImage.src = data.images[0];

            productImage.onload = () => {
                requestAnimationFrame(() => {
                    productImage.classList.remove("changing");
                });
            };

            productImage.onerror = () => {
                productImage.classList.remove("changing");
                console.error("Не удалось загрузить изображение:", productImage.src);
            };

            setTimeout(() => {
                productTitle.classList.remove("title-changing");

                requestAnimationFrame(() => {
                    productPrice.classList.remove("price-changing");
                });
            }, 40);

            hideReserveMessage();

            if (supabaseReady) {
                refreshReservationState(false);
            } else {
                reserveButton.disabled = true;
                reserveButton.textContent = "ПОДКЛЮЧЕНИЕ...";
            }
        }, 220);

        setTimeout(() => {
            colorChanging = false;
        }, 500);
    });
});

/* ==================================================
   ПОСМОТРЕТЬ НА САЙТЕ
================================================== */

websiteButton.addEventListener("click", () => {
    const website = colors[currentColor].website;
    window.open(website, "_blank", "noopener,noreferrer");
});

/* ==================================================
   АНИМАЦИЯ КНОПКИ БРОНИРОВАНИЯ
================================================== */

const reserveAnimationStyle = document.createElement("style");

reserveAnimationStyle.textContent = `
.reserve-button.reserve-click {
    animation: reserveClickAnimation .5s ease;
}

@keyframes reserveClickAnimation {
    0% {
        transform: scale(1);
        box-shadow: 0 0 0 rgba(255,0,0,0);

        transform: scale(.88);

        color: #fff;
        box-shadow: 0 0 20px rgba(255,0,0,.45);
    }

        transform: scale(1.06);
        background: #ff1717;
        border-color: #ff1717;
        color: #fff;
        box-shadow:
            0 0 40px rgba(255,0,0,.65),
            0 0 70px rgba(255,0,0,.25);
    }

        background: #ff2020;
        border-color: #ff2020;
        color: #fff;
        box-shadow: 0 0 25px rgba(255,0,0,.35);
    }
}
`;

document.head.appendChild(reserveAnimationStyle);

/* ==================================================
   АНИМАЦИЯ НАЗАД ПРИ НАЖАТИИ
================================================== */

backButton.addEventListener("click", function(event) {
    event.preventDefault();

    this.classList.remove("back-click");
    void this.offsetWidth;
    this.classList.add("back-click");

    setTimeout(() => {
        window.location.href = "products.html";
    }, 220);
});

const backAnimationStyle = document.createElement("style");

backAnimationStyle.textContent = `
.back-button.back-click {
    animation: backClickAnimation .32s ease;
}

@keyframes backClickAnimation {
    0% {
        transform: translateX(0) scale(1);
    }
    35% {
        transform: translateX(-7px) scale(.92);
    }
    70% {
        transform: translateX(3px) scale(1.03);
    }
    100% {
        transform: translateX(0) scale(1);
    }
}
`;

   ЗАПУСК
================================================== */

initializeSupabase();
</script>
