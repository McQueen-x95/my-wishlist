<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Wishlist — Dior Monogram Crossbody Bag</title>

    <script>
        const navigation = performance.getEntriesByType("navigation")[0];

        if (navigation && navigation.type === "reload") {
            window.location.replace("index.html");
        }
    </script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            min-height: 100vh;
            background:
                radial-gradient(
                    circle at 50% 35%,
                    rgba(80, 0, 0, 0.13),
                    transparent 55%
                ),
                #050505;
            color: #f5f5f5;
            font-family: Arial, Helvetica, sans-serif;
            overflow-x: hidden;
            opacity: 0;
            animation: pageEnter 0.8s ease forwards;
        }

        @keyframes pageEnter {
            from {
                opacity: 0;
                transform: translateY(12px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        button,
        a {
            font: inherit;
        }

        /* Кнопка назад */

        .back-button {
            position: fixed;
            top: 28px;
            left: 35px;
            z-index: 100;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 9px;
            padding: 13px 22px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 30px;
            background: rgba(10, 10, 10, 0.78);
            color: #fff;
            text-decoration: none;
            font-size: 13px;
            letter-spacing: 1.2px;
            transition:
                color 0.3s ease,
                border-color 0.3s ease,
                box-shadow 0.3s ease,
                background 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .back-button:hover {
            color: #ff5b5b;
            border-color: #ff4444;
            background: rgba(25, 0, 0, 0.9);
            box-shadow: 0 0 20px rgba(255, 35, 35, 0.25);
        }

        /* Основной блок */

        .product-page {
            width: min(1250px, calc(100% - 60px));
            min-height: 100vh;
            margin: 0 auto;
            padding: 110px 0 70px;
            display: grid;
            grid-template-columns: minmax(0, 1.1fr) minmax(0, 0.9fr);
            align-items: center;
            gap: 75px;
        }

        /* Галерея */

        .gallery {
            position: relative;
            width: 100%;
            min-width: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: galleryEnter 0.9s ease both;
        }

        @keyframes galleryEnter {
            from {
                opacity: 0;
                transform: translateX(-25px);
            }

            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .gallery-frame {
            position: relative;
            width: 100%;
            height: min(610px, 65vh);
            min-height: 350px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.07);
            border-radius: 22px;
            background:
                radial-gradient(
                    circle,
                    rgba(45, 45, 45, 0.35),
                    rgba(8, 8, 8, 0.9) 70%
                );
            box-shadow:
                0 20px 70px rgba(0, 0, 0, 0.4),
                inset 0 0 40px rgba(255, 255, 255, 0.015);
        }

        .gallery-image {
            width: 100%;
            height: 100%;
            object-fit: contain;
            padding: 25px;
            opacity: 1;
            transform: scale(1);
            transition:
                opacity 0.28s ease,
                transform 0.45s ease;
        }

        .gallery-frame:hover .gallery-image {
            transform: scale(1.025);
        }

        .gallery-arrow {
            position: absolute;
            top: 50%;
            z-index: 5;
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            transform: translateY(-50%);
            border: 1px solid rgba(255, 255, 255, 0.35);
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.65);
            color: #fff;
            font-size: 27px;
            line-height: 1;
            cursor: pointer;
            transition:
                color 0.25s ease,
                border-color 0.25s ease,
                background 0.25s ease,
                box-shadow 0.25s ease;
            backdrop-filter: blur(8px);
        }

        .gallery-arrow:hover {
            color: #ff5555;
            border-color: #ff4444;
            background: rgba(20, 0, 0, 0.9);
            box-shadow: 0 0 20px rgba(255, 40, 40, 0.3);
        }

        .gallery-arrow:active {
            transform: translateY(-50%) scale(0.94);
        }

        .gallery-arrow.left {
            left: 18px;
        }

        .gallery-arrow.right {
            right: 18px;
        }

        /* Информация о товаре */

        .product-info {
            animation: infoEnter 0.9s ease 0.12s both;
        }

        @keyframes infoEnter {
            from {
                opacity: 0;
                transform: translateX(25px);
            }

            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .product-brand {
            margin-bottom: 17px;
            color: #d0d0d0;
            font-size: 13px;
            letter-spacing: 5px;
            text-transform: uppercase;
        }

        .product-title {
            max-width: 560px;
            margin-bottom: 23px;
            color: #fff;
            font-size: clamp(30px, 4vw, 49px);
            font-weight: 600;
            line-height: 1.13;
            letter-spacing: -1.4px;
        }

        .product-description {
            max-width: 490px;
            margin-bottom: 30px;
            color: #a8a8a8;
            font-size: 15px;
            line-height: 1.8;
        }

        /* Только чёрный кружок */

        .color-options {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 27px;
        }

        .color-swatch {
            width: 29px;
            height: 29px;
            padding: 0;
            border: 2px solid rgba(255, 255, 255, 0.8);
            border-radius: 50%;
            background: #000;
            box-shadow: 0 0 12px rgba(255, 255, 255, 0.12);
            cursor: default;
        }

        .product-price {
            margin-bottom: 34px;
            color: #fff;
            font-size: 31px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .product-price span {
            color: #aaa;
            font-size: 15px;
            font-weight: 400;
        }

        /* Кнопки */

        .product-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 13px;
            max-width: 510px;
        }

        .action-button {
            min-height: 54px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0 25px;
            border: 1px solid transparent;
            border-radius: 30px;
            text-align: center;
            text-decoration: none;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 1.1px;
            cursor: pointer;
            transition:
                color 0.3s ease,
                background 0.3s ease,
                border-color 0.3s ease,
                box-shadow 0.3s ease,
                transform 0.3s ease;
        }

        .action-button:hover {
            transform: translateY(-2px);
        }

        .reserve-button {
            flex: 1 1 190px;
            background: #f5f5f5;
            color: #080808;
        }

        .reserve-button:hover {
            background: #ffeded;
            box-shadow: 0 0 25px rgba(255, 50, 50, 0.3);
        }

        .website-button {
            flex: 1 1 190px;
            border-color: rgba(255, 255, 255, 0.45);
            background: transparent;
            color: #fff;
        }

        .website-button:hover {
            border-color: #ff5555;
            color: #ff7777;
            box-shadow: 0 0 20px rgba(255, 40, 40, 0.2);
        }

        .reserve-message {
            min-height: 22px;
            margin-top: 18px;
            color: #c7c7c7;
            font-size: 13px;
            line-height: 1.6;
            opacity: 0;
            transform: translateY(5px);
            transition:
                opacity 0.3s ease,
                transform 0.3s ease;
        }

        .reserve-message.visible {
            opacity: 1;
            transform: translateY(0);
        }

        /* Адаптация */

        @media (max-width: 900px) {
            .product-page {
                width: min(700px, calc(100% - 40px));
                grid-template-columns: 1fr;
                gap: 38px;
                padding-top: 105px;
            }

            .gallery-frame {
                height: min(580px, 65vw);
                min-height: 320px;
            }

            .product-info {
                padding-bottom: 25px;
            }

            .product-title {
                max-width: 100%;
            }

            .product-description {
                max-width: 100%;
            }
        }

        @media (max-width: 600px) {
            .back-button {
                top: 17px;
                left: 16px;
                padding: 11px 17px;
                font-size: 11px;
            }

            .product-page {
                width: calc(100% - 30px);
                gap: 28px;
                padding-top: 85px;
                padding-bottom: 40px;
            }

            .gallery-frame {
                height: 85vw;
                min-height: 280px;
                max-height: 450px;
                border-radius: 16px;
            }

            .gallery-image {
                padding: 15px;
            }

            .gallery-arrow {
                width: 40px;
                height: 40px;
                font-size: 23px;
            }

            .gallery-arrow.left {
                left: 10px;
            }

            .gallery-arrow.right {
                right: 10px;
            }

            .product-brand {
                margin-bottom: 13px;
                font-size: 11px;
                letter-spacing: 3.5px;
            }

            .product-title {
                margin-bottom: 17px;
                font-size: 31px;
                letter-spacing: -0.7px;
            }

            .product-description {
                margin-bottom: 22px;
                font-size: 14px;
            }

            .product-price {
                margin-bottom: 25px;
                font-size: 27px;
            }

            .product-actions {
                flex-direction: column;
            }

            .action-button {
                width: 100%;
                min-height: 52px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                scroll-behavior: auto !important;
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>

<body>

    <a class="back-button" href="products.html">
        <span>←</span>
        <span>НАЗАД</span>
    </a>

    <main class="product-page">

        <section class="gallery" aria-label="Галерея товара">
            <div class="gallery-frame">

                <img
                    id="productImage"
                    class="gallery-image"
                    src="images/dior-bag-1.jpg"
                    alt="Dior Monogram Crossbody Bag"
                >

                <button
                    class="gallery-arrow left"
                    id="prevImage"
                    type="button"
                    aria-label="Предыдущее фото"
                >
                    ‹
                </button>

                <button
                    class="gallery-arrow right"
                    id="nextImage"
                    type="button"
                    aria-label="Следующее фото"
                >
                    ›
                </button>

            </div>
        </section>

        <section class="product-info">

            <p class="product-brand">DIOR</p>

            <h1 class="product-title">
                Dior Monogram Crossbody Bag
            </h1>

            <p class="product-description">
                Мужская сумка через плечо с монограммным дизайном.
                Компактная модель для повседневного использования.
            </p>

            <div class="color-options" aria-label="Цвет товара">
                <button
                    class="color-swatch"
                    type="button"
                    aria-label="Чёрный цвет"
                    title="Чёрный"
                ></button>
            </div>

            <div class="product-price">
                1 500 ₴
            </div>

            <div class="product-actions">

                <button
                    class="action-button reserve-button"
                    id="reserveButton"
                    type="button"
                >
                    ЗАБРОНИРОВАТЬ
                </button>

                <a
                    class="action-button website-button"
                    href="https://epicentrk.ua/shop/mplc-sumka-cerez-plece-kros-bodi-dior-monogramna-19-5h13-sm-cornij-1f1845a5-24c1-698a-abec-4dc5ce45faa1.html"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    ПОСМОТРЕТЬ НА САЙТЕ
                </a>

            </div>

            <p class="reserve-message" id="reserveMessage">
                Чтобы уточнить наличие и забронировать сумку,
                свяжитесь со мной в Telegram.
            </p>

        </section>

    </main>

    <script>
        const images = [
            "images/dior-bag-1.png",
            "images/dior-bag-2.png",
            "images/dior-bag-3.png",
            "images/dior-bag-4.png",
            "images/dior-bag-5.png"
        ];

        const productImage = document.getElementById("productImage");
        const prevImageButton = document.getElementById("prevImage");
        const nextImageButton = document.getElementById("nextImage");

        let currentImageIndex = 0;
        let isChangingImage = false;

        function showImage(index) {
            if (isChangingImage) return;

            currentImageIndex = (index + images.length) % images.length;
            isChangingImage = true;

            productImage.style.opacity = "0";
            productImage.style.transform = "scale(0.98)";

            setTimeout(() => {
                productImage.src = images[currentImageIndex];

                const finishTransition = () => {
                    productImage.style.opacity = "1";
                    productImage.style.transform = "scale(1)";
                    isChangingImage = false;
                };

                productImage.onload = finishTransition;
                productImage.onerror = finishTransition;

                if (productImage.complete) {
                    finishTransition();
                }
            }, 180);
        }

        prevImageButton.addEventListener("click", () => {
            showImage(currentImageIndex - 1);
        });

        nextImageButton.addEventListener("click", () => {
            showImage(currentImageIndex + 1);
        });

        document.addEventListener("keydown", (event) => {
            if (event.key === "ArrowLeft") {
                showImage(currentImageIndex - 1);
            }

            if (event.key === "ArrowRight") {
                showImage(currentImageIndex + 1);
            }
        });

        const reserveButton = document.getElementById("reserveButton");
        const reserveMessage = document.getElementById("reserveMessage");

        reserveButton.addEventListener("click", () => {
            reserveMessage.classList.add("visible");
        });
    </script>

</body>
</html>
